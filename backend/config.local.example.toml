# THIS MACHINE'S LLM OVERRIDES — copy this file to config.local.toml (same folder) only if this
# machine must reach a different gateway or model than config.toml ships.
#
# config.toml ships the CRISIL gateway (provider "bedrock_gateway",
# https://llmgateway.crisil.local/api/bedrock, model us.anthropic.claude-opus-4-7), so most machines
# need no local file at all — only the KEY, in the LLM_GATEWAY_TOKEN environment variable or the
# gitignored backend/.env. Any key here overrides the same key in config.toml. Restart after a
# change. The API KEY never goes in either file.

[llm]
# The gateway's base address. With provider "bedrock_gateway" a request goes to
# <base_url>/model/<model>/invoke.
# base_url = "https://llmgateway.crisil.local/api/bedrock"

# The model id, exactly as it appears in the gateway URL.
# model = "us.anthropic.claude-opus-4-7"

# Uncomment to change the provider for this machine only (see config.toml [llm] for the list).
# provider = "bedrock_gateway"
