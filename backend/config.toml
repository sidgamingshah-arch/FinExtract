# FinExtract configuration.
#
# This file holds non-secret, deployment-tunable settings. It is read at startup by
# app/config.py (via pydantic-settings). Precedence, highest first:
#
#   1. Environment variables (prefix FINEX_, nested with "__", e.g. FINEX_LLM__MODEL)
#   2. .env file
#   3. THIS file (config.toml)
#   4. Built-in defaults in app/config.py
#
# NEVER put secrets (API keys, DB passwords) here. Keys are read from environment
# variables named by *_api_key_env below, so this file can live safely in git.

# ---------------------------------------------------------------------------
# Application identity and mount point
#
# BARE TOP-LEVEL KEYS, NOT AN `[app]` TABLE — that is the fix, not a style choice. These two
# used to be written as `[app] name` + `[app] api_prefix`, and bound to NOTHING: `Settings`
# has no `app` field (the fields are `app_name` and `api_prefix`, declared at the top level in
# app/config.py), and `Settings` sets extra="ignore", so pydantic-settings saw the whole table
# as one unknown key and dropped it. Measured through the loader itself —
# `TomlConfigSettingsSource(Settings)()` returns an `app` key and `'app' in
# Settings.model_fields` is False. Nobody noticed because both shipped values happen to equal
# the built-in defaults, so a deployment that set `api_prefix = "/api/v2"` got a server still
# mounted at /api/v1 with no warning. app/config.py now logs one WARNING naming every key in
# this file that binds to nothing, so the next such typo says so at startup.
#
# Deliberately NOT re-homed under an `AppSettings` submodel: that would rename the environment
# contract from FINEX_API_PREFIX to FINEX_APP__API_PREFIX and silently break any deployment
# using the env override (both forms bind today, verified).
#
# Changing `api_prefix` still needs a frontend change too — frontend/src/lib/api.ts:2
# hardcodes "/api/v1".
app_name = "FinExtract Extraction API"
api_prefix = "/api/v1"

# ---------------------------------------------------------------------------
# Authentication / session
# ---------------------------------------------------------------------------
[auth]
# Accept the X-Role request header as a dev/service credential, but ONLY when the
# request has no valid session token (a real session always wins, so this can never
# escalate or downgrade a logged-in user). OFF by default — turn it on explicitly for
# local dev / CI / machine-to-machine calls; leave it off in production.
allow_role_header = false

# Passwordless quick-login for the seeded demo users (the "Sign in as …" buttons on
# the login screen). SET TO false IN PRODUCTION — real users must supply a password.
demo_mode = true

# Session lifetime, in minutes, before a token must be re-issued.
session_ttl_minutes = 480

# ---------------------------------------------------------------------------
# Feature flags (admin-configurable)
# ---------------------------------------------------------------------------
[features]
# Localize the ENTIRE interface (nav, screens, prose), not just the extracted
# financial output. Off by default: by default only statement line items and notes
# follow the chosen output language; the rest of the app stays English. An admin can
# flip this at runtime from the Settings screen (PATCH /settings) — this value is the
# startup default.
ui_localization = false

# Require a second-person reviewer sign-off on the analyst's output. When false the
# workflow closes at the analyst level (they finalize & export directly). This governs
# the sign-off/hand-off only — the human-in-the-loop Review Queue (checks + low-confidence
# QA) stays available to the analyst regardless. Startup default; admin-flippable.
review_required = true

# Load the seeded sample project at startup. False → the app starts greenfield
# (empty); an admin can load or clear the sample at runtime from the Settings screen.
seed_demo = false

# Default output language for extracted financial data, and the set of languages the app
# offers.
#
# `supported_locales` NARROWS the offered set; it does not define it. The candidates come from
# code — `SEED_LANGUAGES` + `UI_BUNDLES` in app/schemas/languages.py — and each one is then
# gated per template + rulebook on real alias/label parity by `evaluate_parity`, which is what
# GET /languages reports and what the language switcher offers. This list is intersected with
# that registry (api/routes/languages.py), so removing an entry here takes the locale off the
# menu, while adding one that code does not know about does nothing. An empty or absent list
# means "no narrowing", not "no languages".
#
# So ADDING a language is NOT purely a data/asset change, which is what this comment used to
# claim. Beyond the OCR pack, the rulebook `aliases_i18n`, the template `label_i18n` and the
# number-format rules, it needs code on both sides: `SEED_LANGUAGES`/`UI_BUNDLES` above,
# frontend/src/types.ts:4 (the `Locale` union) and frontend/src/i18n.ts:23 (`NATIVE_NAME`) —
# the switcher filters on that last one, so a locale missing from it is dropped even after the
# backend reports it fully supported.
#
# WHERE THIS ONE IS APPLIED. `default_output_locale` names the deployment's output language and
# is resolved into the route defaults by `api/deps.py:32` (`output_locale`), so a HK/PRC
# deployment setting it to "zh" gets Chinese output without every caller passing ?locale=zh. It
# used to be read in exactly one place — the GET /settings echo — while the endpoints that
# actually serve extracted output defaulted to a hardcoded `Query("en")`, so setting it changed
# nothing an analyst could see. An empty or absent value falls back to "en".
default_output_locale = "en"
# …whereas THIS one is not admin-flippable: it is a list, so it does not travel through the
# PATCH /settings contract. It narrows the language menu as described above, and is intersected
# with the parity registry rather than trusted on its own.
supported_locales = ["en", "zh", "ar", "fr"]

# ---------------------------------------------------------------------------
# LLM (used for extraction disambiguation + could back the analysis commentary).
# The adapter is selected by the top-level llm_provider registry id; this section
# configures whichever adapter is selected.
# ---------------------------------------------------------------------------
[llm]
# azure_openai       → Azure OpenAI (DEFAULT). Addresses a DEPLOYMENT on your own resource and
#                      authenticates with an api-key header, so it needs azure_endpoint below —
#                      there is no shared default host the way there is for OpenAI.
# anthropic          → Anthropic Messages API (SDK)
# bedrock_gateway    → Internal Bedrock Anthropic invoke gateway; set base_url + deployment model
# openai / openai_compatible → OpenAI Chat Completions wire format (OpenAI, TokenRouter,
#                      OpenRouter, vLLM, …); set base_url + a vendor/model id below
# stub               → offline / no-op
# There is no `local` llm adapter — `local` is an OBJECT_STORE id (adapters/__init__.py), and this
# menu used to list it. Selecting it reached no registry entry: HTTP 400 on two paths, a logged
# no-op on gap_closing and contingent_liabilities, and a deterministic-only mapping run. It is not
# aliased to `stub` either — map_ontology.py fast-paths the literal "stub" only, so an alias would
# resolve and stamp mapping_strategy="llm_description" on a run that made zero model calls.
#
# Every value here is editable at run time from the Settings screen and persisted, so this file is
# the starting point rather than the commitment: changing model, deployment, region or provider is
# configuration. The KEY is the exception and is never stored — only the NAME of the env var it is
# read from, so it cannot reach the database or a settings export.
provider = "openai_compatible"
model = "azure-openai/gpt5.4-mini"  # gateway model id: "<vendor>/<deployment name>"
# `temperature` was here and is GONE: it reached no provider call (the port default of 0.0 won
# everywhere), so it is fixed at 0.0 in code and is not configuration. See app/config.py's
# LlmSettings for the full note. A leftover value in a local copy of this file is still ignored
# (Settings uses extra="ignore") rather than an error — but it is now NAMED in the startup
# WARNING that lists every key here binding to nothing, so it is visible instead of silent.
# Per-call completion ceiling, shared by every FREE-FORM call — it is passed through verbatim as
# the requested allocation by the gap-routing, contingent-liabilities, commentary/analysis and
# netting paths, so it overrides each callee's own default rather than capping it. Mapping does NOT
# use it: mapping makes no provider call at all, and any line-item request declares its own
# allocation for the reason the retired `llm_batch_response_floor_tokens` recorded — sending a
# request ceiling of millions makes compatible gateways reserve millions of tokens for a small
# structured reply and time out before answering.
# This shipped as 4096000, which is exactly that failure: the gateway's own answer was
# "max_tokens is too large: 4096000. This model supports at most 128000 completion tokens"
# (recorded in tests/test_llm_audit.py). The adapter's adaptive 400 loop recovered it at the cost
# of a wasted round-trip per call, and a gateway that STALLS instead of rejecting was retried three
# times with the same 4,096,000. 32768 clears every callee's own default — the largest is
# run_analysis's 4096 (services/analysis_llm.py) — so nothing is truncated by the change.
max_tokens = 32768
timeout_seconds = 600
base_url = "https://llmgateway.crisil.local/api/openai"
api_key_env = "AZURE_OPENAI_API_KEY" # env var the key is read from (the key itself is NOT stored here)
reasoning_effort = "low"
# Hard ceiling on hidden reasoning tokens; 0 = do not send a cap. Distinct from
# `reasoning_effort` above, which ASKS for reasoning where this BOUNDS it. Required by some
# models rather than optional: one whose reasoning cannot be disabled will otherwise spend
# the whole completion budget thinking and return empty content with finish_reason=length,
# losing the extraction. See backend/.env.example for the value the recorded runs used.
reasoning_max_tokens = 0
disable_ssl_verify = true

# Azure OpenAI address (used when provider = "azure_openai"). Azure selects a deployment on your
# resource, not a model on a shared endpoint, so all three are part of the URL:
#   {azure_endpoint}/openai/deployments/{azure_deployment}/chat/completions?api-version=...
azure_endpoint = ""             # https://<resource>.openai.azure.com
azure_api_version = "2024-12-01-preview"
azure_deployment = ""           # deployment name; empty = use `model` (common when they match)

# ---------------------------------------------------------------------------
# OCR (scanned-page recognition)
# ---------------------------------------------------------------------------
[ocr]
engine = "docling"              # docling (free, recommended) | azure | paddleocr | tesseract | stub
languages = ["en", "ch", "ar", "fr"]   # OCR language packs to load
dpi = 300                       # rasterization DPI for scanned pages

# Azure AI Document Intelligence (used when engine = "azure"). The key is NOT here —
# it's read from the env var named by azure_api_key_env (default AZURE_DI_KEY).
azure_endpoint = ""             # https://<resource>.cognitiveservices.azure.com
azure_model = "prebuilt-layout" # prebuilt-layout | prebuilt-read
azure_api_version = "2024-11-30"
azure_api_key_env = "AZURE_DI_KEY"

# ---------------------------------------------------------------------------
# Extraction / reconciliation tuning
# ---------------------------------------------------------------------------
[extraction]
evidence_floor = 0.55           # how nearly a caption must BE an authored alias to count as one
alias_coverage_floor = 0.45     # …and how much of that alias the caption must explain
mapping_margin = 0.08           # winner must beat the runner-up by this margin, else review
auto_accept_confidence = 0.80   # combined confidence at/above which a line auto-accepts
recon_corroboration_rel = 0.05  # how near a note total must be to the face figure to count as its breakdown
recon_abs_tolerance = 1.0       # absolute tolerance (in base units) for reconciliation ties
recon_rel_tolerance = 0.005     # relative tolerance (fraction of the face value)

# FOCUS RUN — spend the provider budget on the lines under review instead of the whole filing.
# `llm_focus_keys` names WHICH concepts (a deployment decision, and a list, so it cannot travel
# through the admin Settings patch); `llm_focus_only` is the switch, which an admin can also flip
# from the Settings screen at run time.
#
# ON HERE, so that it TRAVELS. The switch an admin flips is stored in the database
# (`setting_overrides`), and the database is deliberately not in git — so a second machine used to
# start with focus routing off and quietly spend the whole provider budget on its first run. This
# file is the value a fresh clone gets.
#
# It was previously false to keep a checked-in value from reconfiguring the test suite, and one
# test did depend on the old default: test_binding_order.py::
# test_a_page_the_classifier_could_not_place_is_routed_per_line asserts UNFOCUSED per-line routing.
# It now pins `llm_focus_only = False` itself, which is where that precondition belongs — a test
# about unfocused routing should say so rather than inherit whichever way a deployment points.
#
# WHAT IT MEANS NOW: which LINE ITEMS the run asks about. It used to name concepts whose printed
# ROWS were forwarded to the model; rows are no longer offered to a model, so there is nothing to
# route. The list below needs no change — a key names a line item either way.
llm_focus_only = true
# THE PARTS ARE NAMED TOO, NOT ONLY THE EIGHT WHOLES, and that is the whole point of this list
# being longer than it looks. Seven of the eight are `derived` or `extract_or_derive`, so the model
# is not offered them at all (`_llm_withheld`) — forwarding a row whose deterministic answer is one
# of those spends a call on a concept the run cannot come back with. Measured before this:
# `focus_keys_nameable_by_model` was 1 of 8, and a live 45-call run changed none of the eight
# figures.
#
# Their PARTS are `extract`, carry no alias (so no deterministic tier competes for them), and are
# the layer a note actually prints — so they are what a call can usefully answer. Naming them here
# is what puts their rows in front of the model.
llm_focus_keys = [
