# THE ROW-LEVEL LLM SETTINGS THAT STOOD HERE ARE RETIRED.
#
# `llm_max_concurrency` (10) sized the thread pool a statement's row chunks were dispatched on;
# `llm_only_keys` restricted the candidate list one row was offered. Both described a call about a
# printed ROW, and no such call is made — concept mapping is deterministic, and the model is asked
# about LINE ITEMS and the notes they name (`llm_request_grouping`). The measured provider notes
# that used to sit here (Groq's 8,000-token minute against 30,000-40,000-token requests; Gemini's
# daily quota; OpenRouter's zero balance) were about those row requests and are kept in git
# history rather than reprinted against a request shape they were never measured on.
# Publish every extracted note regardless of face citation — set per-run via the
# FINEX_EXTRACTION__PRUNE_UNREFERENCED_NOTES env var instead of here, since a checked-in
# change here affects every test and script that reads settings.
prune_unreferenced_notes = true

