[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finex-backend"
version = "0.1.0"
description = "Financial statement extraction platform — backend (FastAPI + extraction pipeline)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "rapidfuzz>=3.6",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Heavy / optional engines — kept out of the core install so the pipeline core and
# API can run (and be tested) without pulling large ML wheels.
pdf = ["pdfplumber>=0.11"]
# Recommended free OCR: pip-only, no system binary, no cloud (layout + OCR + tables).
docling = ["docling>=2.0", "Pillow>=10.2"]
ocr = ["paddleocr>=2.7", "opencv-python-headless>=4.9", "Pillow>=10.2"]
llm = ["anthropic>=0.25"]
lang = ["fasttext-wheel>=0.9.2"]
# Traditional<->Simplified Han folding for CJK filings. Optional: app/services/han.py falls
# back to a built-in table of financial-statement variant pairs when this is absent.
cjk = ["opencc-python-reimplemented>=0.1.7"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "reportlab>=4.1",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
